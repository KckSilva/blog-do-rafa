<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentações - Blog do Rafa</title>
    <link rel="stylesheet" href="../src/style.css">
    <style>
        .docs-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .doc-item {
            background: white;
            padding: 1.5rem;
            margin: 1rem 0;
            border-radius: 8px;
            border-left: 4px solid #3cb371;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        
        .doc-item:hover {
            transform: translateX(5px);
        }
        
        .doc-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        
        .doc-link h3 {
            color: #1a5f3e;
            margin-bottom: 0.5rem;
        }
        
        .doc-link p {
            color: #6c757d;
            margin: 0;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #1a5f3e;
            text-decoration: none;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .empty-message {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="nav-container">
                <div class="logo">
                    <h2><a href="../index.html" style="color: white; text-decoration: none;">Blog do Rafa 🤓</a></h2>
                </div>
                <ul class="nav-menu">
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="#sobre">Sobre</a></li>
                    <li><a href="#conteudo">Conteúdo</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="page-content">
        <div class="container">
            <a href="../index.html" class="back-link">← Voltar para Home</a>
            <h1>📚 Todas as Documentações</h1>
            <p>Lista completa de todas as documentações técnicas disponíveis:</p>
            
            <div class="docs-container" id="docsList">
                <!-- As páginas serão carregadas automaticamente aqui pelo JavaScript -->
                <div class="empty-message">
                    <p>Carregando documentações...</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Blog do Rafa. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Adiciona evento a todos os botões de copiar
        const copyButtons = document.querySelectorAll('.copy-btn');
        
        copyButtons.forEach(button => {
            button.addEventListener('click', function() {
                // Pega o texto do comando (elemento pai é a div.copy-box)
                const codeBox = this.parentElement;
                const commandText = codeBox.childNodes[0].textContent.trim();
                
                // Método que FUNCIONA no GitHub Pages
                copyTextToClipboard(commandText, this);
            });
        });
        
        function copyTextToClipboard(text, button) {
            // 1. Cria um textarea temporário
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-9999px';
            textArea.style.top = '0';
            textArea.style.opacity = '0';
            
            // 2. Adiciona ao DOM
            document.body.appendChild(textArea);
            
            // 3. Seleciona o texto
            textArea.focus();
            textArea.select();
            
            try {
                // 4. Usa o método antigo que FUNCIONA no GitHub Pages
                const successful = document.execCommand('copy');
                
                if (successful) {
                    // Feedback visual
                    showSuccess(button);
                } else {
                    // Fallback: mostra o texto para copiar manualmente
                    showManualCopy(text);
                }
            } catch (err) {
                // Fallback para erro
                showManualCopy(text);
            } finally {
                // 5. Limpa sempre
                document.body.removeChild(textArea);
            }
        }
        
        function showSuccess(button) {
            const originalText = button.textContent;
            button.textContent = '✓ Copiado!';
            button.style.background = '#1a5f3e';
            
            setTimeout(() => {
                button.textContent = originalText;
                button.style.background = '#3cb371';
            }, 1500);
        }
        
        function showManualCopy(text) {
            // Cria um popup simples com o texto para copiar manualmente
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.5);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 10000;
            `;
            
            const popup = document.createElement('div');
            popup.style.cssText = `
                background: white;
                padding: 20px;
                border-radius: 8px;
                max-width: 500px;
                width: 90%;
                text-align: center;
            `;
            
            popup.innerHTML = `
                <h3>📋 Copiar Comando</h3>
                <div style="background: #f5f5f5; padding: 10px; border-radius: 4px; margin: 10px 0; font-family: monospace; word-break: break-all;">
                    ${text}
                </div>
                <p>Selecione o texto acima e use Ctrl+C para copiar</p>
                <button onclick="this.parentElement.parentElement.remove()" style="background: #3cb371; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">
                    Fechar
                </button>
            `;
            
            overlay.appendChild(popup);
            document.body.appendChild(overlay);
            
            // Fecha ao clicar fora
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) {
                    overlay.remove();
                }
            });
        }
    });
</script>
</body>
</html>
